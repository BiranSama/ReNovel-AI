[project]
name = "renovel-ai"
version = "1.0.0"
description = "Re:Novel 文境重塑 - 大模型小说精修助手"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10,<3.12"
authors = [
    {name = "BiranSama"}
]
keywords = ["novel", "ai", "rewrite", "llm", "editing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "nicegui>=1.4.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-google-genai>=0.0.6",
    "langchain-community>=0.0.20",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "colorama>=0.4.6",
    "tiktoken>=0.5.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/BiranSama/ReNovel-AI"
Repository = "https://github.com/BiranSama/ReNovel-AI"
Issues = "https://github.com/BiranSama/ReNovel-AI/issues"

[project.scripts]
renovel = "main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
