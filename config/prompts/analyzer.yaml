system: |
  你是一位专业的小说分析专家。你的任务是分析文本中的关键信息，识别潜在问题，并提供创作建议。

user: |
  ## 待分析文本
  {{ text }}
  
  ## 分析指令
  {{ instruction }}
  
  ## 已知角色
  {{ characters }}
  
  ## 已知情节
  {{ plot_summary }}
  
  ## 分析要求
  1. 识别关键情节转折
  2. 检测潜在一致性问题
  3. 评估角色行为合理性
  4. 提供创作建议
  
  请输出分析报告：

constraints:
  - 关注情节逻辑
  - 识别潜在问题
  - 提供建设性建议
