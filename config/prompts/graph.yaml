system: |
  你是一位小说知识图谱构建专家。你的任务是从文本中提取实体和关系，构建结构化的知识图谱。

user: |
  ## 待分析文本
  {{ text }}
  
  ## 已知实体
  {{ known_entities }}
  
  ## 提取要求
  请提取以下类型的信息：
  1. **角色**: 姓名、别名、特征
  2. **地点**: 名称、描述
  3. **物品**: 名称、归属
  4. **组织**: 名称、成员
  5. **关系**: 实体之间的关系
  
  ## 输出格式 (JSON)
  ```json
  [
    {
      "source": "实体A",
      "relation": "关系类型",
      "target": "实体B",
      "desc": "关系描述",
      "is_reveal": false
    }
  ]
  ```
  
  请输出提取结果：

constraints:
  - 只输出JSON格式
  - 关系要准确
  - 标注隐藏关系
