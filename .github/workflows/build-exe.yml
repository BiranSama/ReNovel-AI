name: build-exe

# 在 Windows 上打包绿色版（解压即用，数据保存在程序旁边的 data 目录），
# 启动自检通过后把程序目录作为工作流附件上传。
# 推送版本标签（如 v0.3.0）时，再用这份打包结果发布 Release，发布说明取自 docs/releases/<标签>.md
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: pip install -r requirements-build.txt
      - name: 打包
        run: nicegui-pack --onedir --noconfirm --name ReNovel main.py
      - name: 启动自检
        env:
          PYTHONUTF8: "1"  # 自检脚本的输出含中文，runner 控制台默认是 cp1252
        run: python scripts/self_test.py dist/ReNovel/ReNovel.exe
      - name: 附带说明
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/ReNovel/
          Copy-Item docs/使用说明.txt dist/ReNovel/
      - uses: actions/upload-artifact@v4
        with:
          name: ReNovel-windows
          path: dist/ReNovel
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows  # 打包和启动自检都通过后才发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReNovel-windows
          path: ReNovel
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Python 的 zipfile 会给中文文件名（使用说明.txt）打上 UTF-8 标记，Windows 解压不乱码
          python3 -m zipfile -c "ReNovel-${TAG}-windows.zip" ReNovel/
          gh release create "$TAG" "ReNovel-${TAG}-windows.zip" --verify-tag \
            --title "ReNovelAI-${TAG}" --notes-file "docs/releases/${TAG}.md"
