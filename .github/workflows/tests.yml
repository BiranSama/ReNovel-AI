name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium
      - name: 运行测试
        run: pytest
